name: holdmywallet
description: HoldMyWallet — pause impulse buys with stranger (or circle) votes. Inspired by Wallet, Please Wait.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  google_mobile_ads: ^5.3.0
  share_plus: ^10.1.4
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
