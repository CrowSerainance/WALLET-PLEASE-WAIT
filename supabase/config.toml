# Supabase local config for HoldMyWallet MVP
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "holdmywallet"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["walletwait://", "http://127.0.0.1:3000"]
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enabled = true
enable_confirmations = false

# Each write function authenticates the caller with Supabase Auth.
[functions.cast-vote]
verify_jwt = false

[functions.create-request]
verify_jwt = false
